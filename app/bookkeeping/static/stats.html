<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 状态栏样式跟暗底走 (my-music 同款): black-translucent = 全出血, 页面伸进
     刘海区, 顶部让位靠 --top-clear 吃 env(safe-area-inset-top) 真值 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/bookkeeping/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/bookkeeping/static/favicon.svg">
<link rel="apple-touch-icon" href="/bookkeeping/static/apple-touch-icon.png?v=3">
<link rel="manifest" href="/bookkeeping/static/manifest.json">
<title>统计 · My Money</title>
<link rel="stylesheet" href="/bookkeeping/static/css/bookkeeping-stats.css?v=3">
</head>
<body>

<header>
  <div class="nav-row">
    <a class="back" href="/bookkeeping/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 7.5 12l7 6.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>返回</a>
    <div class="page-title">统计</div>
  </div>
</header>

<main>
  <div class="month-nav">
    <button type="button" id="m-prev" aria-label="上月">‹</button>
    <div class="m-title" id="m-title"></div>
    <button type="button" id="m-next" aria-label="下月">›</button>
  </div>
  <div class="card sums">
    <div class="sum"><span class="k">支出</span><span class="v out" id="sum-out">¥0</span></div>
    <div class="sum"><span class="k">收入</span><span class="v in" id="sum-in">¥0</span></div>
  </div>
  <div class="card">
    <div class="card-t">支出分类</div>
    <div id="by-cat"></div>
    <div class="empty" id="cat-empty" hidden>这个月还没有支出</div>
  </div>
  <div class="card" id="income-card" hidden>
    <div class="card-t">收入分类</div>
    <div id="by-cat-in"></div>
  </div>
  <div class="card">
    <div class="card-t">按记账人</div>
    <div id="by-who"></div>
    <div class="empty" id="who-empty" hidden>这个月还没有账</div>
  </div>
  <div class="src-note">数据来自这台手机上的本地账本, 与记账页一起同步</div>
</main>

<script src="/bookkeeping/static/category-icons.js?v=15"></script>
<script src="/bookkeeping/static/bookkeeping-stats.js?v=2"></script>
</body>
</html>
