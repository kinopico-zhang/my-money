<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 1.7.0 全应用禁缩放: maximum-scale/user-scalable 掐双击放大/点输入框的自动放大;
     iOS 两指捏合不吃 touch-action, 由 body 后第一条脚本 no-zoom.js 拦 gesture -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 状态栏样式跟暗底走 (my-music 同款): black-translucent = 全出血, 页面伸进
     刘海区, 顶部让位靠 --top-clear 吃 env(safe-area-inset-top) 真值 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/bookkeeping/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/bookkeeping/static/favicon.svg">
<link rel="apple-touch-icon" href="/bookkeeping/static/apple-touch-icon.png?v=3">
<link rel="manifest" href="/bookkeeping/static/manifest.json">
<title>设置 · My Money</title>
<link rel="stylesheet" href="/bookkeeping/static/css/bookkeeping-settings.css?v=4">
</head>
<body data-back="/bookkeeping/">
<script src="/static/no-zoom.js?v=2"></script>
<script src="/static/back-swipe.js?v=2"></script>

<header>
  <div class="nav-row">
    <div class="page-title">设置</div>
  </div>
</header>

<main>
  <div class="card">
    <div class="row"><span class="lbl">当前账号</span><span class="val" id="me-name">…</span></div>
    <a class="row link" href="/bookkeeping/categories?v=1"><span class="lbl">类别管理</span><span class="chev">›</span></a>
    <a class="row link" href="/bookkeeping/changelog?v=1"><span class="lbl">更新日志</span><span class="chev">›</span></a>
    <div class="row"><span class="lbl">版本</span><span class="val" id="ver">…</span></div>
  </div>
  <div class="card">
    <button type="button" class="row link danger" id="logout">退出登录</button>
  </div>
</main>

<script src="/bookkeeping/static/bookkeeping-settings.js?v=2"></script>
</body>
</html>
