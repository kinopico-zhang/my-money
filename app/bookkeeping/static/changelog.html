<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 1.7.0 全应用禁缩放: maximum-scale/user-scalable 掐双击放大/点输入框的自动放大;
     iOS 两指捏合不吃 touch-action, 由 body 后第一条脚本 no-zoom.js 拦 gesture -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 状态栏样式跟暗底走 (my-music 同款): black-translucent = 全出血, 页面伸进
     刘海区, 顶部让位靠 --top-clear 吃 env(safe-area-inset-top) 真值 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/bookkeeping/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/bookkeeping/static/favicon.svg">
<link rel="apple-touch-icon" href="/bookkeeping/static/apple-touch-icon.png?v=3">
<link rel="manifest" href="/bookkeeping/static/manifest.json">
<title>更新日志 · My Money</title>
<link rel="stylesheet" href="/bookkeeping/static/css/bookkeeping-changelog.css?v=15">
</head>
<body data-changelog-api="/bookkeeping/changelog/api/entries" data-back="/bookkeeping/">
<script src="/static/no-zoom.js?v=1"></script>
<script src="/static/back-swipe.js?v=1"></script>

<header>
  <div class="nav-row">
    <details class="nav-menu brand-menu" id="brand-menu">
      <summary>My Money<svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu">
        <a href="/bookkeeping/">记账</a>
        <a class="on" href="/bookkeeping/changelog">更新日志</a>
        <button type="button" class="logout-row" id="logout" title="退出登录">退出登录</button>
      </div>
    </details>
  </div>
</header>

<main>
    <div id="entries">
    <div id="list"></div>
    <div class="state" id="loading"><div class="spin"></div>正在读取版本历史…</div>
    <div class="state" id="error" hidden>
      <div id="error-text">加载失败</div>
      <button type="button" class="retry-btn" id="retry">重试</button>
    </div>
  </div>
</main>

<script src="/static/menu-user.js?v=2"></script>
<script src="/static/changelog-page.js?v=1"></script>
</body>
</html>
