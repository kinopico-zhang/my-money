<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 1.7.0 全应用禁缩放: maximum-scale/user-scalable 掐双击放大/点输入框的自动放大;
     iOS 两指捏合不吃 touch-action, 由 body 后第一条脚本 no-zoom.js 拦 gesture -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 状态栏样式跟暗底走 (my-music 同款): black-translucent = 全出血, 页面伸进
     刘海区, 顶部让位靠 --top-clear 吃 env(safe-area-inset-top) 真值 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/bookkeeping/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/bookkeeping/static/favicon.svg">
<link rel="apple-touch-icon" href="/bookkeeping/static/apple-touch-icon.png?v=3">
<link rel="manifest" href="/bookkeeping/static/manifest.json">
<title>类别管理 · My Money</title>
<link rel="stylesheet" href="/bookkeeping/static/css/bookkeeping-categories.css?v=6">
</head>
<body data-back="/bookkeeping/settings?v=1">
<script src="/static/no-zoom.js?v=2"></script>
<script src="/static/back-swipe.js?v=2"></script>

<header>
  <div class="nav-row">
    <div class="page-title">类别管理</div>
  </div>
</header>

<main>
  <div class="kind-tabs" id="kind-tabs">
    <button type="button" data-kind="expense" class="on">支出</button>
    <button type="button" data-kind="income">收入</button>
  </div>
  <div class="msg" id="msg" hidden></div>
  <div class="card">
    <!-- 顶上这条专职新建大类; 加小类的口在每个大类展开的列表尾 (＋ 添加小类)。
         1.6.2 的就地输入行升成整框 (1.7.0): 名字/图标/颜色一次选齐 -->
    <button type="button" class="add-bar" id="add-cat-btn">＋ 新建大类</button>
  </div>
  <div class="card" id="cat-list"></div>
  <div class="state" id="loading"><div class="spin"></div>正在读取类别…</div>
  <div class="state" id="load-error" hidden>
    <div>加载失败, 检查网络后重试</div>
    <button type="button" class="retry-btn" id="retry">重试</button>
  </div>
</main>

<!-- 新建类别弹框 (1.7.0): 顶栏「＋ 新建大类」与大类列表尾「＋ 添加小类」都进
     这框 (标题/图标预选随入口换)。hidden + .on 双段过渡 (记账页 .pick 同款),
     样式自建 cm-* 一套, 不复用 entry-sheet 那份 (那份只被记账页装) -->
<div id="cat-modal" hidden>
  <div class="cm-mask" id="cm-mask"></div>
  <div class="cm-panel" role="dialog" aria-modal="true" aria-label="新建类别">
    <div class="cm-head"><span id="cm-title">新建大类</span>
      <button type="button" class="cm-x" id="cm-x" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>
    </div>
    <div class="cm-prev">
      <span class="cm-prev-ic" id="cm-icon" aria-hidden="true"></span>
      <input type="text" id="cm-name" maxlength="10" placeholder="类别名字 (1-10 个字)" autocomplete="off" aria-label="类别名字">
    </div>
    <div class="cm-label">图标</div>
    <div class="cm-icons" id="cm-icons"></div>
    <div class="cm-label">颜色</div>
    <div class="cm-colors" id="cm-colors"></div>
    <div class="cm-err" id="cm-err" hidden></div>
    <button type="button" class="cm-ok" id="cm-ok">添加</button>
  </div>
</div>

<script src="/bookkeeping/static/category-icons.js?v=17"></script>
<script src="/bookkeeping/static/bookkeeping-categories.js?v=5"></script>
</body>
</html>
