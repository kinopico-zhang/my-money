<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 1.7.0 全应用禁缩放: maximum-scale/user-scalable 掐双击放大/点输入框的自动放大;
     iOS 两指捏合不吃 touch-action, 由 body 后第一条脚本 no-zoom.js 拦 gesture -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 状态栏样式跟暗底走 (my-music 同款): black-translucent = 全出血, 页面伸进
     刘海区, 顶部让位靠 --top-clear 吃 env(safe-area-inset-top) 真值 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Money">
<link rel="icon" type="image/png" sizes="32x32" href="/bookkeeping/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/bookkeeping/static/favicon.svg">
<link rel="apple-touch-icon" href="/bookkeeping/static/apple-touch-icon.png?v=3">
  <link rel="manifest" href="/bookkeeping/static/manifest.json">
  <title>My Money</title>
<link rel="stylesheet" href="/bookkeeping/static/css/bookkeeping-page.css?v=66">
<link rel="stylesheet" href="/bookkeeping/static/css/bookkeeping-entry-sheet.css?v=45">
<link rel="stylesheet" href="/bookkeeping/static/css/bookkeeping-amount-pad.css?v=12">
<link rel="stylesheet" href="/bookkeeping/static/css/bookkeeping-panes.css?v=36">
</head>
<body data-kind="expense">
<script src="/static/no-zoom.js?v=2"></script>

<div class="sync-strip" id="sync-strip">
  <span class="dot"></span><span id="sync-text">本地账本</span>
</div>

<div id="cal-bar"></div>

<main>
  <!-- 封面 (2.0 挖财版式): 蓝渐变铺到 y=0 (iOS 27 顶带 = 深蓝状态栏观感),
       本月支出大数字 + 收入/结余 + 月预算条 (设了才亮); 数字由 render.js
       renderCover 随账本刷新 (feedMonths 本月口径) -->
  <section class="cover" id="cover">
    <div class="cov-label">本月支出</div>
    <div class="cov-big" id="cov-expense">0.00</div>
    <div class="cov-sub">
      <span>本月收入<b id="cov-income">0.00</b></span>
      <span>结余<b id="cov-balance">0.00</b></span>
    </div>
    <div class="cov-budget" id="cov-budget" hidden>
      <div class="cb-track"><i id="cb-fill"></i></div>
      <div class="cb-txt"><span id="cb-used"></span><span id="cb-total"></span></div>
    </div>
  </section>
  <!-- 快捷行 (2.0): 明细/日历 过渡期滚到页内锚点 (批次 3 换推入页), 周期账走推入层 -->
  <div class="quick-row" id="quick-row">
    <button type="button" class="q-cell" data-q="ledger">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 6.5h11M8.5 12h11M8.5 17.5h11"/><circle cx="4.6" cy="6.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="4.6" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4.6" cy="17.5" r="1.4" fill="currentColor" stroke="none"/></g></svg><span>明细</span>
    </button>
    <button type="button" class="q-cell" data-q="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M8 3.5v3.5M16 3.5v3.5M4 10.5h16"/><path d="M8.5 14.5h2M13.5 14.5h2M8.5 17.5h2"/></g></svg><span>日历</span>
    </button>
    <button type="button" class="q-cell" data-q="cyc">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5a7.5 7.5 0 0 1 13.2-3.4"/><path d="M17.5 4.5v3h-3"/><path d="M19.5 13.5a7.5 7.5 0 0 1-13.2 3.4"/><path d="M6.5 19.5v-3h3"/></g></svg><span>周期账</span>
    </button>
  </div>
  <div class="cal-card" id="cal-card">
    <div class="cal-head">
      <button type="button" id="cal-prev" aria-label="上月">‹</button>
      <div class="cal-title" id="cal-title"></div>
      <button type="button" id="cal-next" aria-label="下月">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
  <div id="feed-top" hidden>︿</div>
  <div id="entry-list"></div>
  <div id="feed-more"></div>
  <div class="list-empty" id="list-empty" hidden>还没有账目</div>
  <div class="feed-end" id="feed-end" hidden></div>
</main>

<div id="sheet-mask" hidden></div>
<div id="sheet" hidden>
  <div class="grab-zone" id="grab-zone"><div class="grab"></div></div>
  <div class="sheet-head">
    <div class="tabs" id="kind-seg">
      <button type="button" data-kind="income" class="inc">收入</button>
      <button type="button" data-kind="expense" class="exp on">支出</button>
    </div>
    <div class="head-btns">
      <button type="button" class="head-btn" id="sheet-del" hidden aria-label="删除"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9.5 7V5.5a1.5 1.5 0 0 1 1.5-1.5h2a1.5 1.5 0 0 1 1.5 1.5V7"/><path d="M6.5 7l.8 12a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9l.8-12"/><path d="M10 11v6M14 11v6"/></g></svg></button>
      <button type="button" class="head-btn" id="sheet-close" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>
    </div>
  </div>
  <div class="amt-line" id="amt-line">
    <button type="button" class="amt-cat" id="amt-cat"><span class="amt-ic" id="amt-cat-ic"></span><span class="amt-name empty" id="amt-cat-name">选类别</span></button>
    <span class="amt-eq" id="amt-eq"></span>
    <input id="f-amount" type="text" inputmode="none" readonly placeholder="0.00" autocomplete="off">
  </div>
  <div class="cat-tiles" id="cat-tiles"></div>
  <button type="button" class="note-line" id="note-btn"><span class="note-t empty" id="note-label">输入备注...</span></button>
  <div class="row2 one">
    <button type="button" class="field when" id="when-btn"><span class="when-t" id="when-label"></span></button>
    <button type="button" class="field tags" id="tag-btn"><span class="tag-t empty" id="tag-label">标签</span></button>
    <!-- 周期账 (1.15.0): 新记才亮出来 (改账不带周期), 点开周期设置层; 设上了亮蓝写重复法 -->
    <button type="button" class="field cyc" id="cyc-btn" hidden><span class="cyc-t" id="cyc-label">周期</span></button>
  </div>
  <!-- 键盘 (2.0 挖财版式): 数字区 3 列 + 右列 ⌫/再记/保存 (保存双高橘);
       四则运算收进数字区上方细条 (计算器功能不丢 — 挖财键盘没有运算键) -->
  <div class="amt-pad" id="amt-pad" role="group" aria-label="金额键盘">
    <div class="calc-strip" role="group" aria-label="运算">
      <button type="button" class="k op" data-k="/">÷</button><button type="button" class="k op" data-k="*">×</button><button type="button" class="k op" data-k="-">−</button><button type="button" class="k op" data-k="+">＋</button>
    </div>
    <div class="pad-keys">
      <button type="button" class="k" data-k="7">7</button><button type="button" class="k" data-k="8">8</button><button type="button" class="k" data-k="9">9</button><button type="button" class="k util" data-k="back">⌫</button>
      <button type="button" class="k" data-k="4">4</button><button type="button" class="k" data-k="5">5</button><button type="button" class="k" data-k="6">6</button><button type="button" class="k again" data-k="again">再记</button>
      <button type="button" class="k" data-k="1">1</button><button type="button" class="k" data-k="2">2</button><button type="button" class="k" data-k="3">3</button><button type="button" class="k done" data-k="done">保存</button>
      <button type="button" class="k zero" data-k="0">0</button><button type="button" class="k" data-k=".">.</button>
    </div>
  </div>
</div>

<div id="cat-pick" class="pick" hidden>
  <div class="cp-mask" id="cp-mask"></div>
  <div class="cp-panel">
    <div class="cp-head"><span>选类别</span>
      <button type="button" class="cp-x" id="cp-x" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>
    </div>
    <div class="cp-list" id="cp-list"></div>
  </div>
</div>

<div id="when-pick" class="pick" hidden>
  <div class="cp-mask" id="wp-mask"></div>
  <div class="cp-panel">
    <div class="cp-head"><span>时间</span>
      <button type="button" class="cp-x" id="wp-x" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>
    </div>
    <div class="wp-box">
      <div class="wp-col wp-date"><div class="wp-scroll" id="wp-date"></div></div>
      <div class="wp-col"><div class="wp-scroll" id="wp-hour"></div></div>
      <div class="wp-col"><div class="wp-scroll" id="wp-min"></div></div>
      <div class="wp-band" aria-hidden="true"></div>
    </div>
  </div>
</div>

<div id="tag-pick" class="pick" hidden>
  <div class="cp-mask" id="tp-mask"></div>
  <div class="cp-panel">
    <div class="cp-head"><span>标签</span>
      <button type="button" class="cp-x" id="tp-x" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>
    </div>
    <div class="tp-new">
      <input type="text" id="tp-new" maxlength="60" placeholder="打一个新标签" autocomplete="off">
      <button type="button" id="tp-add">添加</button>
    </div>
    <div class="cp-list" id="tp-list"></div>
  </div>
</div>

<!-- 周期账设置层 (1.15.0): 点记一笔弹层的「周期」牌弹 — 重复周期/入账日期/
     入账时刻/开始·结束 (控件由 bookkeeping-recurring.js 按周期现摆, 日期时刻
     借上头 when-pick 拨轮的 date/time 两副面孔) -->
<div id="cyc-pick" class="pick" hidden>
  <div class="cp-mask" id="cyp-mask"></div>
  <div class="cp-panel">
    <div class="cp-head"><span>周期账</span>
      <button type="button" class="cp-x" id="cyp-x" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>
    </div>
    <div class="cyp-body" id="cyp-body"></div>
  </div>
</div>

<div id="del-confirm" hidden>
  <div class="dc-mask" id="dc-mask"></div>
  <div class="dc-card" role="alertdialog" aria-modal="true" aria-label="删除账目">
    <div class="dc-title">删除这笔账?</div>
    <div class="dc-msg" id="dc-msg"></div>
    <button type="button" class="dc-btn" id="dc-cancel">取消</button>
    <button type="button" class="dc-btn" id="dc-ok">删除</button>
  </div>
</div>

<div id="note-kb" hidden>
  <input type="text" id="f-note" maxlength="200" placeholder="输入备注..." autocomplete="off" enterkeyhint="done">
</div>

<!-- 2.0 挖财三槽中央 morph (批次 1): 右下角悬浮 ⊕ 退役, 记一笔入口 =
     中央槽; 推入层挂点照旧 -->
<div id="push-stack"></div>
<nav id="tab-bar" class="at-home" aria-label="主导航">
  <button type="button" data-tab="stats">
    <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4.5 19.5h15"/><path d="M7 19.5v-5.5M12 19.5V7.5M17 19.5v-8.5"/></g></svg><span>报表</span>
  </button>
  <div class="tb-mid">
    <button type="button" class="tb-add" id="tab-add" aria-label="记一笔">＋</button>
    <button type="button" class="tb-home" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5L12 4.5l7.5 7"/><path d="M6.5 10v9.5h11V10"/></g></svg><span>首页</span>
    </button>
  </div>
  <button type="button" data-tab="mine">
    <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"/><path d="M5 19.5c1.2-3.2 3.8-4.8 7-4.8s5.8 1.6 7 4.8"/></g></svg><span>我的</span>
  </button>
</nav>

<script src="/bookkeeping/static/bookkeeping-viewport.js?v=1"></script>
<script src="/bookkeeping/static/bookkeeping-merge.js?v=4"></script>
<script src="/bookkeeping/static/amount-calculator.js?v=1"></script>
<script src="/bookkeeping/static/bookkeeping-categorizer.js?v=1"></script>
<script src="/bookkeeping/static/bookkeeping-state.js?v=4"></script>
<script src="/bookkeeping/static/category-icons.js?v=21"></script>
<script src="/bookkeeping/static/bookkeeping-render.js?v=46"></script>
<script src="/bookkeeping/static/bookkeeping-sync.js?v=7"></script>
<script src="/bookkeeping/static/bookkeeping-recurring.js?v=2"></script>
<script src="/bookkeeping/static/bookkeeping-entry-sheet.js?v=32"></script>
<script src="/bookkeeping/static/bookkeeping-amount-pad.js?v=11"></script>
<script src="/bookkeeping/static/bookkeeping-settings.js?v=9"></script>
<script src="/bookkeeping/static/bookkeeping-stats.js?v=33"></script>
<script src="/bookkeeping/static/bookkeeping-report-shot.js?v=4"></script>
<script src="/bookkeeping/static/bookkeeping-categories.js?v=11"></script>
<script src="/bookkeeping/static/bookkeeping-tags.js?v=2"></script>
<script src="/bookkeeping/static/bookkeeping-push.js?v=13"></script>
<script src="/bookkeeping/static/bookkeeping-boot.js?v=10"></script>
</body>
</html>
