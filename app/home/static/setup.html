<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 首启引导页: 库里还没有管理员时才是入口 (服务端自判, 已初始化的部署
     /setup 一律 302 回登录页); 页面本身免登录, 建管理员即种会话 cookie -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/static/manifest.json">
  <title>初始化 · My Money</title>
<link rel="stylesheet" href="/static/css/setup-page.css?v=1">
</head>
<body data-done="/bookkeeping">
<script src="/static/no-zoom.js?v=2"></script>
<div class="card" id="card">
  <div class="icon">💰</div>
  <h1>My Money</h1>
  <div class="sub">首次使用 · 建立管理员</div>
  <form id="form1" autocomplete="on">
    <div class="field">
      <label for="su-name">名称</label>
      <input id="su-name" name="name" type="text" autocapitalize="off"
             autocorrect="off" autocomplete="nickname" maxlength="20"
             placeholder="2~20 个字符" required>
    </div>
    <div class="field">
      <label for="su-pass">密码</label>
      <input id="su-pass" name="new-password" type="password"
             autocomplete="new-password" minlength="6" maxlength="64" required>
      <button type="button" class="eye-btn" id="eye" aria-label="显示密码">
        <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="eye-slash" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
    <div class="field">
      <label for="su-pass2">确认</label>
      <input id="su-pass2" name="confirm-password" type="password"
             autocomplete="new-password" minlength="6" maxlength="64" required>
    </div>
    <button class="btn" type="submit">建立管理员</button>
    <div class="err"></div>
  </form>
  <div class="done" id="done" hidden>
    <div class="done-icon">✅</div>
    <p>初始化完成, 正在进入…</p>
  </div>
</div>
<script src="/static/setup.js?v=1"></script>
</body>
</html>
